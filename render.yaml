# Render Blueprint Specification for MilestonePay AI
# https://render.com/docs/blueprint-spec

services:
  # Fast-API Backend Web Service
  - type: web
    name: milestonepay-api
    runtime: python
    region: oregon
    plan: standard
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: MilestonePay AI
      - key: ENVIRONMENT
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: milestonepay-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYMENT_PROVIDER
        value: paypal
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_REQUEST_TIMEOUT_SECONDS
        value: 20
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: MAX_EVIDENCE_FILES
        value: 5

databases:
  # Managed PostgreSQL Instance
  - name: milestonepay-db
    region: oregon
    plan: standard
    databaseName: milestonepay
    user: milestonepay_user

