services:
  postgres:
    image: postgres:16-alpine
    container_name: milestonepay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: milestonepay_dev
      POSTGRES_USER: milestonepay
      POSTGRES_PASSWORD: milestonepay_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestonepay -d milestonepay_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: milestonepay_postgres_data
